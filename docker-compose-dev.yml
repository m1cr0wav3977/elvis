# Demo network: N node containers on a shared bridge network.
services:
  node1:
    build:
      context: .
      dockerfile: node.Dockerfile
    container_name: node1
    networks:
      botnet:
        ipv4_address: 172.28.0.11
    ports:
      - "8081:8080"
    volumes:
      - ./configs/node1.ini:/app/config.ini

  node2:
    build:
      context: .
      dockerfile: node.Dockerfile
    container_name: node2
    networks:
      botnet:
        ipv4_address: 172.28.0.12
    ports:
      - "8082:8080"
    volumes:
      - ./configs/node2.ini:/app/config.ini


  node3:
    build:
      context: .
      dockerfile: node.Dockerfile
    container_name: node3
    networks:
      botnet:
        ipv4_address: 172.28.0.13
    ports:
      - "8083:8080"
    volumes:
      - ./configs/node3.ini:/app/config.ini

networks:
  botnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
