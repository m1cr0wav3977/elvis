[project]
name = "elvis-botnet"
version = "0.1.0"
description = "Educational P2P networking/messaging demo (node.py / main.py)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elvis-node = "elvis_botnet.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
